[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-labeling-tool"
description = "Utilities for RGB sequence auto-labeling and YOLO dataset creation."
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "argcomplete>=3.1",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
auto-label-tool = "auto_labeling_tool.app.cli:main"

[tool.setuptools.packages.find]
include = ["auto_labeling_tool*"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
